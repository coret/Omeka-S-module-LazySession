[info]
version = "0.1.0"
omeka_version_constraint = "^4.1.0"
name = "LazySession"
description = "Keeps anonymous visitors out of the session table. Their session data travels in an encrypted cookie instead, so crawlers that ignore cookies leave nothing behind, while forms with CSRF protection keep working. Logged-in users keep a normal server-side session."
author = "Bob Coret"
license = "GPL-3.0-or-later"
author_link = "https://github.com/coret"
configurable = false
module_link = "https://github.com/coret/Omeka-S-module-LazySession"
support_link = "https://github.com/coret/Omeka-S-module-LazySession/issues"
